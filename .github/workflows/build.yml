name: Build

on:
  push:
  pull_request:

jobs:
  platformio:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        run: pip install platformio

      - name: Build Mega
        run: pio run -e megaatmega2560

      - name: Build ESP8266
        run: pio run -e esp8266

      - name: Build LittleFS
        run: pio run -e esp8266 -t buildfs
