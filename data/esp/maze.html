<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Maze Solver</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2720%27%20fill%3D%27%2307030f%27%2F%3E%3Ctext%20x%3D%2750%27%20y%3D%2764%27%20font-size%3D%2756%27%20text-anchor%3D%27middle%27%3E%F0%9F%97%BA%EF%B8%8F%3C%2Ftext%3E%3C%2Fsvg%3E"
    />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="netgate.js" defer></script>
    <script src="status_bus.js" defer></script>
    <script src="debug_log.js" defer></script>
    <script src="maze.js" defer></script>
    <script type="module" src="mapping/mapping_boot.js?v=5" defer></script>
    <script type="module" src="autonomy/autonomy.js?v=1" defer></script>
  </head>
  <body class="page-maze">
    <div class="app">
      <header class="top maze-topbar">
        <div class="maze-topbar-left">
          <div class="tag">AUTONOMOUS ROBOT CONTROL</div>
          <h1>MAZE SOLVER</h1>
        </div>
        <div class="maze-topbar-mid">
          <div class="mini-label">AUTO</div>
          <div id="autoStatus">idle</div>
        </div>
        <div class="maze-topbar-right">
          <button class="button button-secondary button-small" onclick="window.location.href='/'">DASH</button>
        </div>
      </header>

      <main class="maze2">
        <section class="panel maze2-map">
          <div class="map-head">
            <div>
              <h2>Map</h2>
              <div class="sub">Live map • Scan matching</div>
            </div>
            <div class="map-head-right">
              <div class="mini-label">STATUS</div>
              <div id="mapStatus" class="status-pill">idle</div>
            </div>
          </div>
          <div class="map-viewport">
            <canvas
              id="mapCanvas"
              width="760"
              height="420"
              data-map-w-cm="80"
              data-map-h-cm="160"
              data-cell-cm="5"
              data-init-ymax-frac="0.4"
              data-init-heading-span-deg="20"
              data-init-wall-sigma-cm="1.5"
              data-track-dx-cm="10"
              data-track-dy-cm="10"
              data-track-dheading-deg="20"
              data-view-margin-cm="6"
              data-goal-x-cm="10"
              data-goal-y-cm="150"
              data-goal-tol-cells="1"
              data-red-inflate-x-cells="1"
              data-red-inflate-y-cells="0"
              data-match-min-dist-cm="2"
              data-match-max-dist-cm="250"
              data-match-w-occ-hit="6"
              data-match-w-free-hit="1"
              data-match-w-conflict="8"
              data-match-max-candidates="45000"
              data-update-free-delta="3"
              data-update-occ-delta="10"
            ></canvas>
          </div>
        </section>

        <section class="panel maze2-run">
          <div class="deck-head">
            <div class="deck-title">Run</div>
          </div>
          <div class="deck-body">
            <div class="auth-row">
              <input
                id="passcodeInput"
                class="auth-input"
                type="password"
                inputmode="numeric"
                autocomplete="off"
                placeholder="1234"
              />
              <button class="button button-outline button-small" onclick="armRobot()">ARM</button>
              <button class="button button-secondary button-small" onclick="disarmRobot()">DISARM</button>
            </div>
            <div class="run-actions">
              <button class="button button-primary button-small" data-requires-arm="1" id="autoStart">AUTO START</button>
              <button class="button button-outline button-small" id="autoStop">STOP</button>
            </div>
            <div class="run-meta">
              <div id="authStatus" class="auth-status">DISARMED</div>
              <div id="linkStatus" class="auth-status">LINK: --</div>
            </div>
          </div>
        </section>

        <div class="maze2-stack">
        <div class="maze2-sensors">
          <section class="panel maze2-sensors-panel">
            <div class="deck-head">
              <div class="deck-title">Sensors</div>
            </div>
            <div class="deck-body">
              <div class="telemetry">
                <div class="tele-item">
                  <div class="mini-label">LIDAR</div>
                  <div id="lidarValue">-- cm</div>
                  <div id="lidarWarning" class="warning hidden">Warning!</div>
                </div>
                <div class="tele-item">
                  <div class="mini-label">COMPASS</div>
                  <div id="compassWebValue">--</div>
                </div>
                <div class="tele-item">
                  <div class="mini-label">COLOR SENSOR</div>
                  <div class="tele-item tele-color">
                    <div class="mini-label">RGB</div>
                    <div id="colorValue">--</div>
                    <div id="colorSwatch" class="color-swatch"></div>
                  </div>
                  <div class="tele-item tele-color">
                    <div class="mini-label">CLASS</div>
                    <div id="classValue">--</div>
                    <div id="classSwatch" class="color-swatch is-empty"></div>
                  </div>
                </div>
              </div>
            </div>
          </section>

          <section class="panel maze2-status">
            <div class="deck-head">
              <div class="deck-title">Status</div>
            </div>
            <div class="deck-body">
              <div class="sensor-status">
                <pre id="debugStatus" class="debug-status debug-status-compact">net=--</pre>
                <details class="debug-log">
                  <summary>Logs</summary>
                  <pre id="debugLog" class="debug-status debug-status-compact">disabled</pre>
                </details>
              </div>
            </div>
          </section>
        </div>

        <div class="maze2-tools">
          <section class="panel maze2-turret">
            <div class="deck-head">
              <div class="deck-title">Turret</div>
            </div>
            <div class="deck-body">
              <div class="tool-section">
                <div class="mini-label tool-section-title">SCAN</div>
                <div class="tool-row tool-row-fill">
                  <button class="button button-secondary button-small" data-requires-arm="1" id="mapScanPlus">SCAN +</button>
                  <button class="button button-secondary button-small" data-requires-arm="1" id="mapScanMinus">SCAN -</button>
                  <button class="button button-outline button-small" id="mapClear">CLEAR</button>
                </div>
                <div class="tool-row tool-row-fill">
                  <button class="button button-outline button-small turret-zero" data-requires-arm="1" onclick="setTurretZero()" title="Set current turret direction as 0° (forward)">SET 0&deg;</button>
                </div>
              </div>

              <div class="tool-divider"></div>

              <div class="tool-section">
                <div class="mini-label tool-section-title">CALIBRATION</div>
                <div class="tool-row tool-wide">
                  <div class="readout readout-compact readout-inline">
                    <div class="mini-label">TICKS/REV</div>
                    <div id="turretCalValue">--</div>
                  </div>
                </div>
                <div class="tool-row tool-wide turret-tpr-row">
                  <input class="tool-input" data-requires-arm="1" id="turretTprPos" type="number" inputmode="numeric" placeholder="CW ticks/rev" min="10" max="200000" />
                  <input class="tool-input" data-requires-arm="1" id="turretTprNeg" type="number" inputmode="numeric" placeholder="CCW ticks/rev" min="10" max="200000" />
                </div>
                <div class="tool-row tool-row-fill turret-tpr-actions">
                  <button class="button button-outline button-small" data-requires-arm="1" onclick="setTurretTpr()">SET</button>
                </div>
              </div>
            </div>
          </section>

          <section class="panel maze2-encoders">
            <div class="deck-head">
              <div class="deck-title">Motor Encoders</div>
            </div>
            <div class="deck-body">
              <div class="tool-row tool-wide">
                <button class="button button-secondary button-small" data-requires-arm="1" onclick="startEncoderCalibration()">MEASURE MM/PULSE</button>
                <div class="readout readout-compact readout-inline">
                  <div class="mini-label">MM/PULSE</div>
                  <div id="encCalValue">--</div>
                </div>
              </div>
            </div>
          </section>
        </div>
        </div>
      </main>
    </div>
  </body>
</html>
