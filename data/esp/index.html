<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mobile Robot Control</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20viewBox%3D%270%200%20100%20100%27%3E%3Crect%20width%3D%27100%27%20height%3D%27100%27%20rx%3D%2720%27%20fill%3D%27%2307030f%27%2F%3E%3Ctext%20x%3D%2750%27%20y%3D%2764%27%20font-size%3D%2756%27%20text-anchor%3D%27middle%27%3E%F0%9F%A4%96%3C%2Ftext%3E%3C%2Fsvg%3E"
    />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <script src="js/common/viewport_lock.js" defer></script>
    <script src="js/common/netgate.js" defer></script>
    <script src="js/common/comms/store.js" defer></script>
    <script src="js/common/comms/telemetry_manager.js" defer></script>
    <script src="js/common/comms/orchestrator.js" defer></script>
    <script src="js/pages/script.js" defer></script>
  </head>
  <body class="page-dash">
    <div class="app">
      <header class="top dash-topbar">
        <div>
          <div class="tag">AUTONOMOUS ROBOT CONTROL</div>
          <h1>DASHBOARD</h1>
        </div>
      </header>

      <main class="dash2">
        <section class="panel dash2-auth">
          <div class="deck-head">
            <div class="deck-title">Auth</div>
          </div>
          <div class="deck-body">
            <div class="auth-form">
              <input
                id="passcodeInput"
                class="auth-input"
                type="password"
                inputmode="numeric"
                autocomplete="off"
                placeholder="Passcode"
              />
              <div class="auth-buttons">
                <button class="button button-outline button-small" onclick="armRobot()">ARM</button>
                <button class="button button-secondary button-small" onclick="disarmRobot()">DISARM</button>
              </div>
            </div>
            <div class="auth-meta">
              <div id="authStatus" class="auth-status">DISARMED</div>
              <div id="linkStatus" class="auth-status">LINK: --</div>
            </div>
          </div>
        </section>

        <section class="panel dash2-mission">
          <div class="deck-head">
            <div class="deck-title">Mission</div>
          </div>
          <div class="deck-body">
            <button class="button button-primary button-small" onclick="openMazeSolver()">MAZE DASHBOARD</button>
          </div>
        </section>

        <section class="panel dash2-drive">
          <div class="deck-head">
            <div class="deck-title">Movement</div>
          </div>
          <div class="deck-body">
            <div class="container">
              <button class="button fwd" data-requires-arm="1" onclick="forwards5()">FORWARD<br />5cm</button>
              <button class="button fwd" data-requires-arm="1" onclick="forwards20()">FORWARD<br />20cm</button>
              <button class="button back" data-requires-arm="1" onclick="backwards5()">BACKWARD<br />5cm</button>
              <button class="button back" data-requires-arm="1" onclick="backwards20()">BACKWARD<br />20cm</button>
            </div>
          </div>
        </section>

        <section class="panel dash2-turn">
          <div class="deck-head">
            <div class="deck-title">Turning</div>
          </div>
          <div class="deck-body">
            <label class="label" for="compassSlider">Turn Angle</label>
            <input
              type="range"
              min="-360"
              max="360"
              step="5"
              id="compassSlider"
              oninput="updateCompass(this.value)"
              onchange="sendCompassValue(this.value)"
              value="0"
            />
            <div id="compassValue">0°</div>
            <div class="north-container">
              <button class="button button-outline" data-requires-arm="1" onclick="setNorth()">SET NORTH</button>
              <button class="button button-secondary" data-requires-arm="1" onclick="faceNorth()">FACE NORTH</button>
            </div>
          </div>
        </section>

        <section class="panel dash2-sensors">
          <div class="deck-head">
            <div class="deck-title">Sensors</div>
          </div>
          <div class="deck-body">
            <div class="telemetry">
              <div class="tele-item">
                <div class="mini-label">LIDAR</div>
                <div id="lidarValue">-- cm</div>
                <div id="lidarWarning" class="warning hidden">Warning!</div>
              </div>
              <div class="tele-item">
                <div class="mini-label">COMPASS</div>
                <div id="compassWebValue">--</div>
              </div>
              <div class="tele-item tele-color">
                <div class="mini-label">COLOR</div>
                <div id="colorValue">--</div>
                <div id="colorSwatch" class="color-swatch"></div>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>
  </body>
</html>
